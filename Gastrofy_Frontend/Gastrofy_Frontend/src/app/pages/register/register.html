<div class="auth-page">
  <div class="auth-card">
    <h1>Criar conta</h1>
    <p class="subtitle">Cadastre-se no Gastrofy</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input
          id="nome"
          name="nome"
          type="text"
          [(ngModel)]="form.nome"
          required
          placeholder="Digite seu nome"
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="form.email"
          required
          placeholder="Digite seu email"
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          [(ngModel)]="form.senha"
          required
          placeholder="Crie uma senha"
        />
      </div>

      <p class="erro" *ngIf="erro">{{ erro }}</p>
      <p class="sucesso" *ngIf="sucesso">{{ sucesso }}</p>

      <div class="token-box" *ngIf="tokenVerificacaoEmail">
        <strong>Token de verificação:</strong>
        <p>{{ tokenVerificacaoEmail }}</p>

        <button type="button" class="secondary-button" (click)="irParaLogin()">
          Ir para login
        </button>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Criando conta...' : 'Criar conta' }}
      </button>
    </form>

    <p class="footer-text">
      Já tem conta?
      <a routerLink="/login">Entrar</a>
    </p>
  </div>
</div>
