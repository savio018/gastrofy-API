# Configuração completa dos testes de integração.
# A classe base aponta spring.config.location para este arquivo, então o
# application.properties de src/main/resources NÃO é carregado nos testes.

spring.application.name=gastrofy-api-test

# H2 em memória, modo MySQL
spring.datasource.url=jdbc:h2:mem:gastrofy-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Sem OSIV: um acesso lazy fora de transação tem que estourar nos testes
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# JWT (valores fictícios)
jwt.secret=gastrofy-test-secret-0123456789abcdef0123456789abcdef0123456789abcdef
jwt.expiration=3600000

# Email (o EmailService é mockado nos testes)
resend.api.key=fake
app.base.url=http://localhost
